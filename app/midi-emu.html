<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Эмулятор деки</title>
<style>
  body { margin: 0; padding: 16px 20px; background: #121316; color: #e8e8ea; font: 15px/1.45 'Segoe UI', sans-serif; user-select: none; }
  h2 { margin: 0 0 6px; } select, button { font: inherit; }
  .bar { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; color: #9aa0aa; }
  select { background: #2b2d31; color: #fff; border: 1px solid #3d4047; border-radius: 6px; padding: 4px 8px; }
  #rev { padding: .35em .9em; border-radius: 8px; border: 1px solid #3d4047; background: #2b2d31; color: #fff; cursor: pointer; }
  #degv { font-family: monospace; color: #e8e14a; min-width: 4em; }

  /* дека: джог сверху, CUE и PLAY по бокам, пады под джогом, фейдер микса внизу */
  #deck { width: 560px; padding: 22px 24px 20px; border-radius: 14px; background: linear-gradient(#2c2d30, #1f2023); border: 1px solid #3a3c41;
          display: grid; grid-template-columns: 84px 1fr 84px; grid-template-areas: "cue jog play" "pads pads pads" "fader fader fader"; gap: 18px 10px; align-items: end; }
  #jog { grid-area: jog; justify-self: center; width: 340px; height: 340px; border-radius: 50%; position: relative; touch-action: none; cursor: grab;
         background: repeating-conic-gradient(#3a3d44 0 8deg, #26282c 8deg 16deg); box-shadow: 0 0 0 3px #0a0a0b; }
  #top { position: absolute; inset: 44px; border-radius: 50%; background: radial-gradient(circle at 50% 38%, #2f3136, #0d0e10 75%); }
  #top.touch { box-shadow: inset 0 0 0 3px #2fd85a; }
  .btn { width: 84px; height: 84px; border-radius: 50%; border: 3px solid #3d4047; background: radial-gradient(circle at 50% 35%, #33353a, #101113 75%); color: #ddd; font-weight: 700; cursor: pointer; }
  .btn[data-k=cue] { grid-area: cue; color: #ff9a3b; } .btn[data-k=play] { grid-area: play; color: #2fd85a; }
  #pads { grid-area: pads; display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; padding: 0 60px; }
  .pad { height: 62px; border-radius: 6px; border: 2px solid #3d7dff; background: #05080f; color: #9db9ff; font-weight: 700; cursor: pointer; }
  .pad:active, .btn:active { background: #2fd85a; color: #06120a; }
  #faderBox { grid-area: fader; display: flex; align-items: center; gap: 12px; padding: 0 60px; color: #9aa0aa; font-size: 13px; }
  #fader { flex: 1; accent-color: #d8d8dc; height: 28px; }
  pre { background: #0c0d0f; border: 1px solid #2b2d31; border-radius: 8px; padding: 10px; height: 7em; overflow: auto; margin-top: 14px; font-size: 13px; width: 588px; }
  small { color: #7d838d; }
</style>
</head>
<body>
<h2>Эмулятор деки</h2>
<div class="bar">
  <span>Выход: <select id="out"></select></span>
  <span>Дека: <select id="mode">
    <option value="flx6">как DDJ-FLX6 (левый дек)</option>
    <option value="alt">незнакомая (другие коды и кодировка)</option>
    <option value="abs">незнакомая (абсолютный энкодер, без касания)</option>
  </select></span>
  <button id="rev">Ровно три оборота ↻</button><span id="degv">0°</span>
</div>
<div id="deck">
  <button class="btn" data-k="cue">CUE</button>
  <div id="jog"><div id="top"></div></div>
  <button class="btn" data-k="play">PLAY</button>
  <div id="pads"></div>
  <div id="faderBox"><span>A</span><input id="fader" type="range" min="0" max="127" value="64"><span>B</span></div>
</div>
<small>Серединой диска — с касанием (рука на платтере), ободом — без. Игру открыть в соседнем окне: <code>http://localhost:8090/</code></small>
<pre id="log"></pre>
<script>
// status, data1; jog: enc offset (64±n) | twos (1..63 / 127..65) | abs (позиция 0..127), tpr — тиков на оборот
const MODES = {
  flx6: { top: [0xB0, 0x22], side: [0xB0, 0x21], enc: 'offset', tpr: 7200, touch: [0x90, 0x36], pads: i => [0x97, i], play: [0x90, 0x0B], cue: [0x90, 0x0C], fader: [0xB6, 0x1F] },
  alt:  { top: [0xB1, 0x10], side: [0xB1, 0x11], enc: 'twos',   tpr: 600,  touch: [0x91, 0x20], pads: i => [0x99, 0x24 + i], play: [0x91, 0x05], cue: [0x91, 0x06], fader: [0xB1, 0x40] },
  abs:  { top: [0xB2, 0x30], side: [0xB2, 0x30], enc: 'abs',    tpr: 128,  touch: null,         pads: i => [0x92, 0x40 + i], play: [0x92, 0x01], cue: [0x92, 0x02], fader: [0xB2, 0x50] },
};
const $ = s => document.querySelector(s), log = t => { const l = $('#log'); l.textContent = (t + '\n' + l.textContent).slice(0, 3000); };
const hex = d => d.map(b => b.toString(16).toUpperCase().padStart(2, '0')).join(' ');
let acc, out, mode = MODES.flx6, pos = 0;
const send = (d, quiet) => { if (!out) return; out.send(d); if (!quiet) log('→ ' + hex(d)); };
navigator.requestMIDIAccess().then(a => {
  acc = a; const sel = $('#out');
  for (const p of a.outputs.values()) sel.add(new Option(p.name, p.id));
  const pick = [...a.outputs.values()].find(p => / A$/.test(p.name)); if (pick) sel.value = pick.id;
  out = a.outputs.get(sel.value); sel.onchange = () => out = a.outputs.get(sel.value);
  log(out ? 'Выход: ' + out.name : 'Нет MIDI-выходов — создай петлю (tools/midi_loop.cmd)');
}, e => log('Нет доступа к MIDI: ' + e.message));
$('#mode').onchange = e => { mode = MODES[e.target.value]; log('Режим: ' + e.target.selectedOptions[0].text); };

for (let i = 0; i < 8; i++) {
  const b = document.createElement('button'); b.className = 'pad'; b.textContent = i + 1;
  b.onpointerdown = () => send([...mode.pads(i), 0x7F]); b.onpointerup = () => send([...mode.pads(i), 0x00]);
  $('#pads').appendChild(b);
}
document.querySelectorAll('.btn').forEach(b => { b.onpointerdown = () => send([...mode[b.dataset.k], 0x7F]); b.onpointerup = () => send([...mode[b.dataset.k], 0x00]); });
$('#fader').oninput = e => send([...mode.fader, +e.target.value], true);
$('#fader').onchange = e => log(`фейдер: ${e.target.value} (${hex(mode.fader)})`);

// джог: угол пальца → тики
const jog = $('#jog'), top_ = $('#top'); let drag = null, angle = 0, frac = 0, sent = 0, turned = 0;
const ang = e => { const r = jog.getBoundingClientRect(); return Math.atan2(e.clientY - r.top - r.height / 2, e.clientX - r.left - r.width / 2) * 180 / Math.PI; };
const tick = (key, c) => {
  if (mode.enc === 'offset') send([...key, 64 + c], true);
  else if (mode.enc === 'twos') send([...key, c > 0 ? c : 128 + c], true);
  else { pos = (pos + c + 1280) % 128; send([...key, pos], true); }
};
jog.onpointerdown = e => {
  const onTop = e.target === top_; drag = { a: ang(e), key: onTop ? mode.top : mode.side, touch: onTop && mode.touch };
  turned = 0; jog.setPointerCapture(e.pointerId); if (drag.touch) { send([...mode.touch, 0x7F]); top_.classList.add('touch'); }
};
jog.onpointermove = e => {
  if (!drag) return; const a = ang(e); let d = a - drag.a; if (d > 180) d -= 360; if (d < -180) d += 360; drag.a = a;
  angle += d; turned += d; jog.style.transform = `rotate(${angle}deg)`; $('#degv').textContent = Math.round(turned) + '°';
  frac += d * mode.tpr / 360; let n = Math.trunc(frac); frac -= n; sent += n;
  while (n) { const c = Math.max(-63, Math.min(63, n)); n -= c; tick(drag.key, c); }
};
// для мастера: ровно три оборота по часовой мелкими шагами, с касанием, если оно есть
$('#rev').onclick = async () => {
  const key = mode.top, total = mode.tpr * 3; let left = total; if (mode.touch) send([...mode.touch, 0x7F]);
  const per = Math.max(1, Math.round(total / 200)), stepMax = Math.max(1, Math.min(12, Math.round(mode.tpr / 300)));
  while (left > 0) {
    let n = Math.min(per, left); left -= n; angle += n * 360 / mode.tpr; jog.style.transform = `rotate(${angle}deg)`;
    while (n) { const c = Math.min(stepMax, n); n -= c; tick(key, c); }
    await new Promise(r => setTimeout(r, 16));
  }
  if (mode.touch) send([...mode.touch, 0x00]); log(`три оборота: ${total} тиков (${hex(key)})`);
};
jog.onpointerup = jog.onpointercancel = () => {
  if (!drag) return; if (drag.touch) { send([...mode.touch, 0x00]); top_.classList.remove('touch'); }
  log(`джог: ${sent} тиков (${hex(drag.key)})`); sent = 0; drag = null;
};
</script>
</body>
</html>
