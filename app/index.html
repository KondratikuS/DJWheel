<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<link rel="manifest" href='data:application/manifest+json,{"name":"DJ Wheel","short_name":"DJ Wheel","display":"fullscreen","orientation":"landscape","background_color":"%23000000","theme_color":"%23000000","start_url":"."}'>
<title>DJ Wheel</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,500;0,700;1,400&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    --red-dim: #5a1416;
    --green: #2fd85a;
    --lcd: #d9e6ff;
    --lcd-bg: #0c1018;
    --text: #e8e8ea;
    --w: min(100vw, calc(100vh * 16 / 9));   /* кадр 16:9 */
    --h: calc(var(--w) * 9 / 16);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; touch-action: none; }
  body {
    font-family: 'Montserrat', 'Segoe UI', sans-serif; color: var(--text);
    display: flex; align-items: center; justify-content: center;
    user-select: none; -webkit-user-select: none;
  }
  #frame {
    position: relative; width: var(--w); height: var(--h); overflow: hidden;
    background: radial-gradient(ellipse at 50% 40%, #2e3034 0%, #1a1b1e 55%, #0f1012 100%);
  }
  #bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  #bg.missing { display: none; }
  #frame::before {                      /* зерно, если фон не загрузился */
    content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .28;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.5 0 0 0 0 0.5 0 0 0 0 0.5 0 0 0 0.5 0'/></filter><rect width='200' height='200' filter='url(%23n)'/></svg>");
  }

  /* ── табло ── */
  #display {                            /* место и размер — LAYOUT.display (экран пульта) */
    position: absolute; z-index: 6; left: 50%; top: 1.2%; transform: translateX(-50%);
    width: 40%; height: 11.5%;
    background: linear-gradient(#0a0d13, var(--lcd-bg));
    border: 2px solid #3a3d44; border-radius: 10px;
    box-shadow: inset 0 0 30px #000, 0 2px 0 #46494f, 0 -1px 0 #000, 0 10px 30px rgba(0,0,0,.6);
    display: flex; align-items: center; justify-content: center; text-align: center;
    padding: 1.5% 3%; overflow: hidden;
  }
  #display::after {                     /* блик стекла */
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(170deg, rgba(255,255,255,.07) 0%, transparent 45%);
  }
  #lcd { display: flex; flex-direction: column; gap: .35em; width: 100%; }
  #lcd .tag { font-family: 'Share Tech Mono', monospace; font-size: calc(var(--h) * .02); letter-spacing: .3em; color: #6f86b8; }
  #lcd .q { font-weight: 700; font-size: calc(var(--h) * .034); line-height: 1.2; color: var(--lcd); text-shadow: 0 0 12px rgba(120,160,255,.5); }
  #eq { position: absolute; inset: 0; width: 100%; height: 100%; display: none; }
  #display.eq #lcd { display: none; }
  #display.eq #eq { display: block; }

  /* ── колесо ── */
  .deck {                              /* размер и место задаёт LAYOUT.jogs */
    position: absolute; z-index: 1; left: 50%; top: 46%; transform: translate(-50%, -50%);
    width: calc(var(--h) * .45); height: calc(var(--h) * .45);
  }
  .deck svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .platter { cursor: grab; transform-origin: 500px 500px; }
  .platter.grab { cursor: grabbing; }
  .platter.spin { animation: spin 3.6s linear infinite; }
  .jogName {                           /* экран в центре джога: имя трека этой деки */
    position: absolute; z-index: 2; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 60%; aspect-ratio: 1; border-radius: 50%;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .3em; text-align: center; pointer-events: none;
    background: radial-gradient(circle at 50% 40%, #15171c, #07080a 70%); box-shadow: inset 0 0 18px #000, 0 0 0 2px #26282d;
    color: #d9e6ff; font: 700 calc(var(--h) * .026) 'Montserrat', sans-serif; letter-spacing: .06em; text-shadow: 0 0 10px rgba(120,160,255,.5);
  }
  .jogName small { font: 400 calc(var(--h) * .016) 'Share Tech Mono', monospace; letter-spacing: .12em; color: #6f86b8; }
  .jogName.hot { color: #2fd85a; text-shadow: 0 0 12px rgba(47,216,90,.7); }
  #fader {                             /* ручка кроссфейдера: ходит по LAYOUT.fader вместе с миксом */
    position: absolute; z-index: 6; transform: translate(-50%, -50%); border-radius: 3px; pointer-events: none;
    background: linear-gradient(#e8e8ea, #9a9ca3 45%, #5c5e65 50%, #c8c9cd); box-shadow: 0 2px 6px #000, inset 0 0 0 1px #3a3c42;
    transition: left .05s linear;
  }
  #faderTrack { position: absolute; z-index: 5; transform: translate(-50%, -50%); height: 2px; background: #3a3c42; pointer-events: none; }
  #fader { pointer-events: auto; cursor: ew-resize; }
  .vknob {                             /* ручки фейдеров каналов и темпа: ходят по LAYOUT.chans / LAYOUT.tempo */
    position: absolute; z-index: 6; transform: translate(-50%, -50%); border-radius: 3px; cursor: ns-resize; touch-action: none;
    background: linear-gradient(#f2f2f3, #b9bbc0 40%, #ffffff 48%, #ffffff 52%, #8d8f95 60%, #c9cacd); box-shadow: 0 2px 6px #000, inset 0 0 0 1px #45474d;
  }
  .vknob.tempo { background: linear-gradient(#3a3b3f, #1a1b1e 44%, #ffffff 49%, #ffffff 51%, #1a1b1e 56%, #2a2b2e); }
  .vtrack { position: absolute; z-index: 5; transform: translate(-50%, 0); width: 3px; background: transparent; cursor: ns-resize; touch-action: none; }
  @keyframes spin { to { transform: rotate(360deg); } }


  /* ── пады дека с семплами (место — LAYOUT.pads, сама кнопка — на фоне) ── */
  .pad {
    position: absolute; z-index: 6; transform: translate(-50%, -50%); cursor: pointer;
    background: #05080f; border: 2px solid var(--c, #3d7dff); border-radius: 4px; box-shadow: 0 0 6px var(--c, #3d7dff);
    opacity: 0; pointer-events: none; padding: 0;
    font: 700 calc(var(--h) * .0092) 'Montserrat', sans-serif; letter-spacing: 0; color: #dfe3ea; overflow: hidden; line-height: 1;
    transition: opacity .3s, background .1s, box-shadow .1s, left .9s ease-in-out, top .9s ease-in-out, width .9s ease-in-out, height .9s ease-in-out, font-size .9s ease-in-out;
  }
  .pad.show { opacity: 1; pointer-events: auto; }
  .pad.still { transition: none; }
  .pad.show.hit { background: var(--c, #2fd85a); color: #06120a; box-shadow: 0 0 28px var(--c, #2fd85a); }

  /* ── светодиоды каналов: свои поверх фото, на финале — эквалайзер (LAYOUT.leds) ── */
  .led { position: absolute; z-index: 3; transform: translate(-50%, -50%); border-radius: 2px; background: #1c1d20; pointer-events: none; transition: background .06s, box-shadow .06s; }
  .led.on { background: var(--c); box-shadow: 0 0 6px var(--c); }


</style>
</head>
<body>
<div id="frame">
  <img id="bg" src="img/bg.png" alt="" onerror="this.classList.add('missing'); document.getElementById('fakeRim').style.display=''">
  <div id="display">
    <div id="lcd"><div class="tag" id="tag">DJ WHEEL</div><div class="q" id="question">КОСНИСЬ ЭКРАНА</div></div>
    <canvas id="eq"></canvas>
  </div>

  <div id="deck" class="deck">
    <svg id="wheel" viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
      <defs>
        <radialGradient id="gRim" cx="50%" cy="45%" r="55%">
          <stop offset="80%" stop-color="#3a3d43"/><stop offset="92%" stop-color="#6a6e76"/><stop offset="100%" stop-color="#1b1c1f"/>
        </radialGradient>
        <radialGradient id="gPlatter" cx="50%" cy="40%" r="60%">
          <stop offset="0%" stop-color="#2a2b2f"/><stop offset="70%" stop-color="#151618"/><stop offset="100%" stop-color="#0a0a0b"/>
        </radialGradient>
        <linearGradient id="gShine" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#fff" stop-opacity=".18"/><stop offset="50%" stop-color="#fff" stop-opacity="0"/>
        </linearGradient>
        <clipPath id="cpPlatter"><circle cx="500" cy="500" r="332"/></clipPath>
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".8"/></filter>
      </defs>

      <!-- корпус есть на фоне-фото; рисованный — только если фона нет -->
      <g id="fakeRim" filter="url(#shadow)">
        <circle cx="500" cy="500" r="470" fill="url(#gRim)"/>
        <circle cx="500" cy="500" r="470" fill="url(#gShine)"/>
        <circle cx="500" cy="500" r="352" fill="#0c0d0f"/>
      </g>

      <!-- вращающийся диск -->
      <g id="platter" class="platter">
        <circle cx="500" cy="500" r="340" fill="url(#gPlatter)"/>
        <g id="grooves" stroke="#fff" stroke-opacity=".045" fill="none"/>
        <image class="photo" xlink:href="img/wheel.png" x="30" y="30" width="940" height="940" clip-path="url(#cpPlatter)"/>
        <!-- маркер -->
        <g id="marker">
          <line x1="500" y1="168" x2="500" y2="235" stroke="#2fd85a" stroke-width="7" stroke-linecap="round"/>
          <line x1="500" y1="168" x2="500" y2="235" stroke="#2fd85a" stroke-width="18" stroke-linecap="round" opacity=".35"/>
        </g>
      </g>
    </svg>
    <div class="jogName" id="jogA"><small>A</small><span>—</span></div>
  </div>
  <div id="deck2" class="deck">
    <svg viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
      <g id="platter2" class="platter">
        <circle cx="500" cy="500" r="340" fill="url(#gPlatter)"/>
        <image class="photo" xlink:href="img/wheel2.png" x="30" y="30" width="940" height="940" clip-path="url(#cpPlatter)"/>
        <g class="marker">
          <line x1="500" y1="168" x2="500" y2="235" stroke="#2fd85a" stroke-width="7" stroke-linecap="round"/>
          <line x1="500" y1="168" x2="500" y2="235" stroke="#2fd85a" stroke-width="18" stroke-linecap="round" opacity=".35"/>
        </g>
      </g>
    </svg>
    <div class="jogName" id="jogB"><small>B</small><span>—</span></div>
  </div>
  <div id="faderTrack"></div><div id="fader"></div>
</div>

<script src="layout.js"></script>
<script>
/* ───────── ДАННЫЕ ─────────
   Треки одной длины и одного темпа (tools/prep_tracks.py). Играют всегда парой: 1-2, 2-3, 3-1 … — оба трека
   идут с одной позиции, фейдер деки переливает между ними (A = первый в паре, B = второй), скретч тянет оба.
   Когда петля доходит до конца, пара сдвигается: второй трек становится первым. */
const DATA = {
  tracks: [
    { name: '3RD TRACK', url: 'audio/3rdtrack.ogg' },
    { name: 'BEYOND',    url: 'audio/beyond.ogg' },
    { name: 'VENICE',    url: 'audio/venice.ogg' },
  ],
  bpm: 124, bars: 88,
  samples: { kick: 'audio/kick.ogg', hat: 'audio/hat.ogg', clap: 'audio/clap.ogg', snare: 'audio/snare.ogg', tamb: 'audio/tamb.ogg', crash: 'audio/crash.ogg', cymbal: 'audio/cymbal.ogg', horn: 'audio/horn.ogg',
             laser: 'audio/laser.ogg', hit: 'audio/hit.ogg', zap: 'audio/zap.ogg', cowbell: 'audio/cowbell.ogg', rim: 'audio/rim.ogg', yeah: 'audio/yeah.ogg', drop: 'audio/drop.ogg', whoosh: 'audio/whoosh.ogg' },   // семплы с Pixabay через tools/prep_samples.py
  vinyl: 200,               // градусов в секунду при обычном ходе = 33⅓ об/мин; скретч считает скорость колеса от этой
  touchStopMs: 35,          // коснулся диска — трек замирает за столько
  releaseMs: 220,           // отпустил — разгон до обычного хода
  tempoRange: .1,           // ход фейдера темпа ±10 % (как ±10 на пульте)
  eq: { low: 250, mid: 1200, high: 4000, min: -26, max: 6 },   // полосы и ход фейдеров каналов в дБ (внизу −26, в середине 0, вверху +6)
};

const CX = 500, CY = 500;
const NS = 'http://www.w3.org/2000/svg';
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const platter = $('#platter'), platter2 = $('#platter2'), platters = [platter, platter2], display = $('#display'), tag = $('#tag'), question = $('#question');
const jogA = $('#jogA span'), jogB = $('#jogB span'), fader = $('#fader'), jogAbpm = $('#jogA small'), jogBbpm = $('#jogB small');
const el = (n, attrs = {}) => { const e = document.createElementNS(NS, n); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; };

// фото колеса: если файла нет — прячем, остаётся рисованный диск
$$('.photo').forEach(im => im.addEventListener('error', () => im.remove()));
$('#fakeRim').style.display = 'none';

/* ───────── РАСКЛАДКА ПО ФОТО ПУЛЬТА (layout.js из tools/build_bg.py) ───────── */
const L = typeof LAYOUT !== 'undefined' ? LAYOUT : null;
// две деки по восемь падов: 1–8 — левая, 9–16 — правая (на XDJ-XZ / FLX6 — пады второго дека)
const PADS = [['kick', 'KICK', '#2fd85a'], ['hat', 'HAT', '#e8e14a'], ['clap', 'CLAP', '#ff7a3b'], ['snare', 'SNARE', '#4a9bff'],
              ['tamb', 'TAMB', '#c77dff'], ['crash', 'CRASH', '#e8e8ea'], ['cymbal', 'CYMBAL', '#3de0d0'], ['horn', 'HORN', '#ff4d6d'],
              ['laser', 'LASER', '#3de0d0'], ['hit', 'HIT', '#e8e14a'], ['zap', 'ZAP', '#ff4d6d'], ['cowbell', 'COWBELL', '#ff7a3b'],
              ['rim', 'RIM', '#4a9bff'], ['yeah', 'YEAH', '#c77dff'], ['drop', 'DROP', '#2fd85a'], ['whoosh', 'WHOOSH', '#e8e8ea']];
const leds = [];                // столбики светодиодов: {els сверху вниз, v}
const IMG = {};                 // при сборке в один файл pack_single_file.py кладёт сюда data-URI картинок
// пады крупно в два ряда: дека 1 сверху, дека 2 снизу, центр группы — 50 %
const PAD_TARGET = { ys: [70.5, 80.8], w: 6.0, h: 8.8, xs: [26.2, 33, 39.8, 46.6, 53.4, 60.2, 67, 73.8], font: .0135 };
function addPad(i) {
  const b = document.createElement('button'); b.className = 'pad show'; b.dataset.s = PADS[i][0]; b.style.setProperty('--c', PADS[i][2]);
  const p = L && L.pads && L.pads.length >= PADS.length ? L.pads[i] : null;
  if (p) { b.style.left = p.x * 100 + '%'; b.style.top = p.y * 100 + '%'; b.style.width = p.w * 100 + '%'; b.style.height = p.h * 100 + '%'; }
  else { b.style.left = PAD_TARGET.xs[i % 8] + '%'; b.style.top = PAD_TARGET.ys[i >> 3] + '%'; b.style.width = PAD_TARGET.w + '%'; b.style.height = PAD_TARGET.h + '%'; b.style.fontSize = `calc(var(--h) * ${PAD_TARGET.font})`; }
  b.textContent = PADS[i][1]; $('#frame').appendChild(b);
}
PADS.forEach((_, i) => addPad(i));
// v = null — как на фото (горят все, кроме нижнего); число или массив 0..1 — уровень столбика
function setLeds(v) {
  leds.forEach((c, i) => {
    const lvl = v === null ? 1 : Array.isArray(v) ? v[i] : v, n = c.els.length;
    c.els.forEach((e, k) => e.classList.toggle('on', v === null ? k < n - 1 : (n - k) / n <= lvl + 1e-6));
  });
}
const chan = [1, .8125, .8125, .8125];  // фейдеры каналов 0..1: громкость (1 = 0 дБ) и три полосы (0.8125 = 0 дБ при ходе −26…+6)
let tempo = 0;                          // −1…1 → ×(1 + tempo · tempoRange)
const chanKnobs = [], tempoKnobs = [];
if (L) {
  (L.jogs || [L.jog]).forEach((j, i) => {                                // джоги по фото: r джога = r470 нашей рамки
    const deck = $$('.deck')[i]; if (!deck) return; const size = 2 * j.r * 500 / 470;
    deck.style.left = j.x * 100 + '%'; deck.style.top = j.y * 100 + '%';
    deck.style.width = deck.style.height = `calc(var(--h) * ${size.toFixed(4)})`;
  });
  if (L.screen) $$('.jogName').forEach(e => e.style.width = (L.screen * 470 / 500 * 100) + '%');
  if (L.display) { const d = L.display; display.style.left = (d.x + d.w / 2) * 100 + '%'; display.style.top = d.y * 100 + '%'; display.style.width = d.w * 100 + '%'; display.style.height = d.h * 100 + '%'; }
  if (L.fader) { const f = L.fader; fader.style.top = f.y * 100 + '%'; fader.style.width = f.kw * 100 + '%'; fader.style.height = f.kh * 100 + '%';
    const t = $('#faderTrack'); t.style.left = (f.x0 + f.x1) / 2 * 100 + '%'; t.style.top = f.y * 100 + '%'; t.style.width = (f.x1 - f.x0) * 100 + '%'; }
  // вертикальные ручки: четыре канала (громкость, низкие, средние, высокие) и два темпа (оба — один общий темп)
  const vslider = (g, cls, get, set) => {
    const k = document.createElement('div'); k.className = 'vknob ' + cls; k.style.left = g.x * 100 + '%'; k.style.width = g.kw * 100 + '%'; k.style.height = g.kh * 100 + '%';
    const t = document.createElement('div'); t.className = 'vtrack'; t.style.left = g.x * 100 + '%'; t.style.top = g.y0 * 100 + '%'; t.style.height = (g.y1 - g.y0) * 100 + '%'; t.style.width = (g.kw * 100) + '%';
    $('#frame').append(t, k);
    const place = () => k.style.top = (g.y1 - get() * (g.y1 - g.y0)) * 100 + '%';           // 0 внизу, 1 вверху
    const drag = e => { const f = $('#frame').getBoundingClientRect(); set(Math.max(0, Math.min(1, (g.y1 - (e.clientY - f.top) / f.height) / (g.y1 - g.y0)))); };
    [k, t].forEach(el => { el.addEventListener('pointerdown', e => { el.setPointerCapture(e.pointerId); el.onpointermove = drag; drag(e); }); el.addEventListener('pointerup', () => el.onpointermove = null); el.addEventListener('pointercancel', () => el.onpointermove = null); });
    return place;
  };
  if (L.chans) L.chans.forEach((g, i) => chanKnobs.push(vslider(g, 'chan', () => chan[i], v => setChan(i, v))));
  if (L.tempo) L.tempo.forEach(g => tempoKnobs.push(vslider(g, 'tempo', () => (tempo + 1) / 2, v => setTempo(v * 2 - 1))));
  chanKnobs.forEach(f => f()); tempoKnobs.forEach(f => f());
  // кроссфейдер — тянуть ручку или ткнуть в дорожку
  if (L.fader) { const f = L.fader, t = $('#faderTrack'); t.style.pointerEvents = 'auto'; t.style.height = (f.kh * 100) + '%'; t.style.cursor = 'ew-resize';
    const drag = e => { const r = $('#frame').getBoundingClientRect(); setMix(((e.clientX - r.left) / r.width - f.x0) / (f.x1 - f.x0)); if (typeof showMix === 'function') showMix(); };
    [fader, t].forEach(el => { el.addEventListener('pointerdown', e => { el.setPointerCapture(e.pointerId); el.onpointermove = drag; drag(e); }); el.addEventListener('pointerup', () => el.onpointermove = null); el.addEventListener('pointercancel', () => el.onpointermove = null); }); }
  L.leds.forEach(col => {
    const els = col.map(([x, y], k) => {
      const e = document.createElement('div'); e.className = 'led'; e.style.setProperty('--c', L.led.colors[k]);
      e.style.left = x * 100 + '%'; e.style.top = y * 100 + '%'; e.style.width = L.led.w * 100 + '%'; e.style.height = L.led.h * 100 + '%';
      $('#frame').appendChild(e); return e;
    });
    leds.push({ els, v: 0 });
  });
  setLeds(null);
}

// бороздки на диске
const grooves = $('#grooves');
for (let r = 135; r < 336; r += 4) grooves.appendChild(el('circle', { cx: CX, cy: CY, r }));

let rot = 0, state = 'idle';          // idle — ждём первого касания (браузер не даёт звук без жеста), play — играет
const setRot = a => { rot = a; const t = `rotate(${a}deg)`; platter.style.transform = t; platter2.style.transform = t; };
const angleOf = e => { const b = e.currentTarget.ownerSVGElement.getBoundingClientRect(); return Math.atan2(e.clientY - (b.top + b.height / 2), e.clientX - (b.left + b.width / 2)) * 180 / Math.PI; };

/* ───────── МОСТ: события игры наружу (tools/bridge.py → Resolume, grandMA, MIDI) ─────────
   POST text/plain без CORS-преамбулы, не ждём ответа; моста нет — молчим. */
const BRIDGE = { url: 'http://localhost:7777/ev', on: true };
let emitMixT = 0;
function emit(ev) {
  if (!BRIDGE.on) return;
  try { fetch(BRIDGE.url, { method: 'POST', body: JSON.stringify(ev), headers: { 'Content-Type': 'text/plain' }, keepalive: true }).catch(() => {}); } catch (e) {}
}

// полный экран можно просить только по жесту — делаем это на первом касании (iPhone Safari не умеет, там — «На экран Домой»)
function goFullscreen() {
  const el = document.documentElement, rq = el.requestFullscreen || el.webkitRequestFullscreen;
  if (rq && !document.fullscreenElement && !document.webkitFullscreenElement) { try { const p = rq.call(el, { navigationUI: 'hide' }); if (p && p.catch) p.catch(() => {}); } catch (e) {} }
  if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(() => {});
}
$$('.pad').forEach(p => {
  p.addEventListener('pointerdown', () => { playSample(p.dataset.s); p.classList.add('hit'); setTimeout(() => p.classList.remove('hit'), 120); });
});

/* ───────── ЗВУК ───────── */
let ac, analyser, master, trackGain, eqLow, eqMid, eqHigh, eqRaf = 0;
let mix = .5;                  // микс двух половин трека: 0 — только A, 1 — только B (фейдер деки)
function ensureAudio() {
  if (ac) { if (ac.state !== 'running') ac.resume(); return; }
  ac = new (window.AudioContext || window.webkitAudioContext)();
  analyser = ac.createAnalyser(); analyser.fftSize = 256; analyser.smoothingTimeConstant = .8;
  master = ac.createGain(); master.connect(analyser); analyser.connect(ac.destination);
  trackGain = ac.createGain(); trackGain.connect(master);
  eqLow = ac.createBiquadFilter(); eqLow.type = 'lowshelf'; eqLow.frequency.value = DATA.eq.low;
  eqMid = ac.createBiquadFilter(); eqMid.type = 'peaking'; eqMid.frequency.value = DATA.eq.mid; eqMid.Q.value = .7;
  eqHigh = ac.createBiquadFilter(); eqHigh.type = 'highshelf'; eqHigh.frequency.value = DATA.eq.high;
  eqLow.connect(eqMid).connect(eqHigh).connect(trackGain);
  chan.forEach((v, i) => setChan(i, v));
  loadVinyl(); drawEq();
}
function ramp(g, v, t) { g.gain.cancelScheduledValues(ac.currentTime); g.gain.setValueAtTime(g.gain.value, ac.currentTime); g.gain.linearRampToValueAtTime(v, ac.currentTime + t); }
const bufs = {};
function loadBuf(url) {
  if (!bufs[url]) bufs[url] = fetch(url).then(r => r.arrayBuffer()).then(b => ac.decodeAudioData(b)).catch(e => { console.warn('трек не загрузился', url, e); delete bufs[url]; return null; });
  return bufs[url];
}

/* ───────── ВИНИЛ: пару треков читает воркет с любой скоростью, в том числе назад ─────────
   Пока диск не трогают — скорость 1 и диск крутится сам (33⅓ об/мин). Коснулся — оба трека замерли, вращение
   двигает общую позицию (скорость колеса / DATA.vinyl), отпустил — разгон до обычного хода. Параметр mix —
   фейдер деки между первым и вторым треком пары (равная мощность). Треки лежат в воркете как Int16. */
const VINYL_SRC = `
class Vinyl extends AudioWorkletProcessor {
  static get parameterDescriptors() { return [{ name: 'mix', defaultValue: .5, minValue: 0, maxValue: 1, automationRate: 'k-rate' }]; }
  constructor() {
    super(); this.tracks = {}; this.pair = null; this.len = 0; this.pos = 0; this.rate = 1; this.target = 1; this.k = 1; this.n = 0; this.count = 0;
    this.port.onmessage = e => {
      const m = e.data;
      if (m.track != null) { this.tracks[m.track] = m.ch; this.len = m.len; this.count = m.count; }
      if (m.pair) { this.pair = m.pair; this.pos = 0; this.rate = this.target = 1; this.k = 1; }
      if (m.rate != null) { this.target = m.rate; this.k = m.ms ? 1 - Math.exp(-1000 / (m.ms * sampleRate)) : 1; }
      if (m.stop) this.pair = null;
    };
  }
  process(_, outputs, params) {
    const out = outputs[0]; if (!out.length) return true;
    const L = out[0], R = out[1] || out[0], n = L.length, len = this.len;
    const A = this.pair && this.tracks[this.pair[0]], B = this.pair && this.tracks[this.pair[1]];
    if (!A) { L.fill(0); R.fill(0); return true; }
    const m = params.mix[0], ga = Math.cos(m * Math.PI / 2) / 32768, gb = Math.sin(m * Math.PI / 2) / 32768;
    const a0 = A[0], a1 = A[1] || A[0], b0 = B ? B[0] : null, b1 = B ? (B[1] || B[0]) : null;
    for (let i = 0; i < n; i++) {
      this.rate += (this.target - this.rate) * this.k;
      let p = this.pos;
      if (p >= len) { p -= len; if (this.rate > 0) { this.pair = [this.pair[1], (this.pair[1] + 1) % this.count]; this.port.postMessage({ pair: this.pair }); this.pos = p; return this.process(_, outputs, params); } }
      if (p < 0) p += len; if (p < 0 || p >= len) p = 0;
      const i0 = p | 0, f = p - i0, i1 = i0 + 1 < len ? i0 + 1 : 0;
      let l = (a0[i0] + (a0[i1] - a0[i0]) * f) * ga, r = (a1[i0] + (a1[i1] - a1[i0]) * f) * ga;
      if (b0) { l += (b0[i0] + (b0[i1] - b0[i0]) * f) * gb; r += (b1[i0] + (b1[i1] - b1[i0]) * f) * gb; }
      L[i] = l; R[i] = r; this.pos = p + this.rate;
    }
    if (++this.n % 4 === 0) this.port.postMessage({ pos: this.pos, rate: this.rate });
    return true;
  }
}
registerProcessor('vinyl', Vinyl);`;
let vinyl = null, vinylReady = null, vpos = 0, vrate = 1, vt = 0, vRaf = 0, vBase = 0, pair = null;
function loadVinyl() {
  if (vinylReady || !ac.audioWorklet) return;
  const url = URL.createObjectURL(new Blob([VINYL_SRC], { type: 'application/javascript' }));
  vinylReady = ac.audioWorklet.addModule(url).then(() => {
    vinyl = new AudioWorkletNode(ac, 'vinyl', { numberOfInputs: 0, outputChannelCount: [2] });
    vinyl.connect(eqLow); setMix(mix); vinylRate(baseRate(), 50);
    vinyl.port.onmessage = e => {
      const m = e.data;
      if (m.pos != null) { vpos = m.pos; vrate = m.rate; vt = performance.now(); }
      if (m.pair) { vBase = rot; vpos = 0; vt = performance.now(); showPair(m.pair); if (!touchHold) vinylRate(baseRate(), 1); }
    };
  }).catch(e => { console.warn('воркет винила не поднялся', e); vinylReady = null; });
}
let trackLen = 0;
async function sendTrack(i) {                                   // трек → Int16 в воркет (передача без копирования)
  const b = await loadBuf(DATA.tracks[i].url); if (!b || !vinyl) return false;
  if (!trackLen) trackLen = b.length;
  const len = Math.min(trackLen, b.length), ch = Array.from({ length: b.numberOfChannels }, (_, c) => { const f = b.getChannelData(c), o = new Int16Array(len); for (let k = 0; k < len; k++) o[k] = f[k] * 32767; return o; });
  delete bufs[DATA.tracks[i].url];                               // в основном потоке копия не нужна
  vinyl.port.postMessage({ track: i, ch, len, count: DATA.tracks.length }, ch.map(x => x.buffer)); return true;
}
function showPair(p) {
  pair = p; const [i, j] = p; tag.textContent = `ПАРА ${i + 1} – ${j + 1}`; question.textContent = `${DATA.tracks[i].name}  ⟷  ${DATA.tracks[j].name}`;
  jogA.textContent = DATA.tracks[i].name; jogB.textContent = DATA.tracks[j].name; showFader();
  emit({ ev: 'pair', a: i + 1, b: j + 1, nameA: DATA.tracks[i].name, nameB: DATA.tracks[j].name });
}
async function startPlay() {
  if (state !== 'idle') return; state = 'play'; emit({ ev: 'state', state: 'play' }); emit({ ev: 'start' });
  display.classList.add('eq'); setLeds(0);
  trackGain.gain.setValueAtTime(0, ac.currentTime); ramp(trackGain, .8 * chan[0] * chan[0], 1.2);
  if (vinylReady) await vinylReady;
  if (!vinyl) { question.textContent = 'НУЖЕН НОВЫЙ БРАУЗЕР'; return; }   // без AudioWorklet (очень старые браузеры) игры нет
  const n = DATA.tracks.length;
  jogA.textContent = DATA.tracks[0].name; jogB.textContent = DATA.tracks[1 % n].name; setTempo(tempo);
  if (!(await sendTrack(0)) || !(await sendTrack(1 % n))) return;
  vinyl.port.postMessage({ pair: [0, 1 % n] }); vinylRate(baseRate(), 1); vpos = 0; vrate = 1; vt = performance.now(); vBase = rot; showPair([0, 1 % n]); spinLoop();
  for (let i = 2; i < n; i++) await sendTrack(i);               // остальные — следом, к смене пары успеют
}
// диск крутится по позиции трека: между сообщениями воркета угол дотягиваем по скорости
function spinLoop() {
  const p = vpos + vrate * (performance.now() - vt) / 1000 * ac.sampleRate;
  setRot(vBase + p / ac.sampleRate * DATA.vinyl);
  vRaf = requestAnimationFrame(spinLoop);
}
// скретч: скорость колеса (градусов/с) → скорость трека; нет движения 60 мс при удержании — стоп
let touchHold = null, holdT = 0;
function vinylRate(r, ms) { if (vinyl) vinyl.port.postMessage({ rate: r, ms }); }
const baseRate = () => 1 + tempo * DATA.tempoRange;
// фейдер темпа (оба на пульте — один общий): меняет скорость обоих треков, высота тоже плывёт, как на виниле
function setTempo(t) {
  tempo = Math.max(-1, Math.min(1, t)); tempoKnobs.forEach(f => f());
  const bpm = (DATA.bpm * baseRate()).toFixed(1); jogAbpm.textContent = 'A · ' + bpm; jogBbpm.textContent = 'B · ' + bpm;
  if (!touchHold) vinylRate(baseRate(), 120);
  emit({ ev: 'tempo', v: +tempo.toFixed(3), bpm: +bpm });
}
// фейдеры каналов: 0 — громкость (0 дБ вверху, тишина внизу), 1..3 — низкие / средние / высокие (−26…+6 дБ)
const CHAN_NAMES = ['vol', 'low', 'mid', 'high'];
function setChan(i, v) {
  chan[i] = Math.max(0, Math.min(1, v)); if (chanKnobs[i]) chanKnobs[i]();
  if (ac) {
    if (i === 0) trackGain.gain.setTargetAtTime(.8 * chan[0] * chan[0], ac.currentTime, .02);
    else { const db = DATA.eq.min + chan[i] * (DATA.eq.max - DATA.eq.min); [eqLow, eqMid, eqHigh][i - 1].gain.setTargetAtTime(db, ac.currentTime, .02); }
  }
  emit({ ev: 'chan', n: i + 1, name: CHAN_NAMES[i], v: +chan[i].toFixed(3) });
}
function scratchTouch(on) {
  if (state !== 'play' || !vinyl) return;
  if (on) { touchHold = { t: performance.now(), a: null }; platters.forEach(p => p.classList.add('grab')); vinylRate(0, DATA.touchStopMs); emit({ ev: 'scratch', on: true }); }
  else if (touchHold) { touchHold = null; platters.forEach(p => p.classList.remove('grab')); clearTimeout(holdT); vinylRate(baseRate(), DATA.releaseMs); emit({ ev: 'scratch', on: false }); }
}
function scratchDeg(deg, dtMs) {
  if (state !== 'play' || !vinyl) return;
  if (!touchHold) { touchHold = { t: performance.now(), a: null, auto: true }; platters.forEach(p => p.classList.add('grab')); }   // джог без датчика касания: держим, пока идут тики
  vinylRate(deg / Math.max(1, dtMs) * 1000 / DATA.vinyl, 12);
  clearTimeout(holdT); holdT = setTimeout(() => { if (touchHold && touchHold.auto) scratchTouch(false); else vinylRate(0, 30); }, touchHold.auto ? 90 : 60);
}
platters.forEach(pl => {                                        // оба диска скретчат одну общую позицию
  pl.addEventListener('pointerdown', e => {
    scratchTouch(true); if (!touchHold) return;
    pl.setPointerCapture(e.pointerId); touchHold.a = angleOf(e); touchHold.t = performance.now();
  });
  pl.addEventListener('pointermove', e => {
    if (!touchHold || touchHold.a == null) return;
    const a = angleOf(e); let d = a - touchHold.a; if (d > 180) d -= 360; if (d < -180) d += 360;
    const now = performance.now(); scratchDeg(d, now - touchHold.t); touchHold.a = a; touchHold.t = now;
  });
  pl.addEventListener('pointerup', () => scratchTouch(false)); pl.addEventListener('pointercancel', () => scratchTouch(false));
});
function nextPair() { if (state === 'play' && vinyl && pair) { const p = [pair[1], (pair[1] + 1) % DATA.tracks.length]; vinyl.port.postMessage({ pair: p }); vinylRate(baseRate(), 1); vBase = rot; vpos = 0; vt = performance.now(); showPair(p); emit({ ev: 'next' }); } }
// без пульта: фейдер — стрелки ← → (или A / D), следующая пара — N
addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'ф') { setMix(mix - .05); if (typeof showMix === 'function') showMix(); }
  if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'в') { setMix(mix + .05); if (typeof showMix === 'function') showMix(); }
  if (e.key === 'n' || e.key === 'т') nextPair();
  if (e.key === 'ArrowUp') setTempo(tempo + .05); if (e.key === 'ArrowDown') setTempo(tempo - .05);
});

// фейдер деки: равная мощность между треками пары
function setMix(x) {
  mix = Math.max(0, Math.min(1, x));
  const now = performance.now(); if (now - emitMixT > 50) { emitMixT = now; emit({ ev: 'mix', v: +mix.toFixed(3) }); } if (!ac) return;
  if (vinyl) vinyl.parameters.get('mix').setTargetAtTime(mix, ac.currentTime, .02);
  showFader();
}
// ручка кроссфейдера на фото и подсветка имени трека, который громче
function showFader() {
  if (L && L.fader) fader.style.left = (L.fader.x0 + mix * (L.fader.x1 - L.fader.x0)) * 100 + '%';
  $('#jogA').classList.toggle('hot', mix < .35); $('#jogB').classList.toggle('hot', mix > .65);
}

// семплы падов
const sampleBuf = {};
function playSample(name, vol = 1) {
  ensureAudio();
  const url = DATA.samples[name]; if (!url) return;
  if (sampleBuf[name]) {
    emit({ ev: 'pad', n: PADS.findIndex(p => p[0] === name) + 1, name });   // один раз на удар, не на догрузку файла
    const out = ac.createGain(); out.gain.value = vol; out.connect(master);
    const s = ac.createBufferSource(); s.buffer = sampleBuf[name]; s.connect(out); s.start();
  } else fetch(url).then(r => r.arrayBuffer()).then(b => ac.decodeAudioData(b)).then(b => { sampleBuf[name] = b; playSample(name, vol); });
}
function preloadSamples() { if (!ac) return; Object.entries(DATA.samples).forEach(([n, u]) => { if (u && !sampleBuf[n]) fetch(u).then(r => r.arrayBuffer()).then(b => ac.decodeAudioData(b)).then(b => { sampleBuf[n] = b; }); }); }

function drawEq() {
  cancelAnimationFrame(eqRaf);
  const c = $('#eq'), ctx = c.getContext('2d');
  const buf = new Uint8Array(analyser.frequencyBinCount);
  const loop = () => {
    analyser.getByteFrequencyData(buf);
    if (leds.length && state === 'play') {   // светодиоды каналов: 8 полос от баса к верху, падают с инерцией
      setLeds(leds.map((c, i) => {
        const a = Math.floor(Math.pow(i / leds.length, 1.6) * 48), b = Math.floor(Math.pow((i + 1) / leds.length, 1.6) * 48) + 1;
        let m = 0; for (let k = a; k < b; k++) m = Math.max(m, buf[k]);
        return c.v = Math.max(c.v - .05, Math.min(1, m / 255 * 1.15));
      }));
    }
    if (display.classList.contains('eq')) {
      const w = c.width = c.clientWidth * devicePixelRatio, h = c.height = c.clientHeight * devicePixelRatio;
      ctx.clearRect(0, 0, w, h);
      const bars = 40, bw = w / bars, pad = bw * .25;
      for (let i = 0; i < bars; i++) {
        const v = buf[Math.floor(Math.pow(i / bars, 1.4) * 56)] / 255;
        const bh = Math.max(3, v * h * .85);
        const g = ctx.createLinearGradient(0, h, 0, h - bh);
        g.addColorStop(0, '#2fd85a'); g.addColorStop(.7, '#e8e14a'); g.addColorStop(1, '#ff3b3b');
        ctx.fillStyle = g; ctx.fillRect(i * bw + pad, h - bh - h * .08, bw - pad * 2, bh);
      }
    }
    eqRaf = requestAnimationFrame(loop);
  };
  loop();
}

// первое касание экрана: полный экран, звук, семплы, и сразу поехал первый трек
function begin() { goFullscreen(); ensureAudio(); preloadSamples(); startPlay(); }
addEventListener('pointerdown', begin, { once: true });
emit({ ev: 'state', state: 'idle' });
</script>
<script src="midi.js"></script>
</body>
</html>
