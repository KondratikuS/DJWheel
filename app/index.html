<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<link rel="manifest" href='data:application/manifest+json,{"name":"DJ Wheel","short_name":"DJ Wheel","display":"fullscreen","orientation":"landscape","background_color":"%23000000","theme_color":"%23000000","start_url":"."}'>
<title>DJ Wheel</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,500;0,700;1,400&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    --red-dim: #5a1416;
    --green: #2fd85a;
    --lcd: #d9e6ff;
    --lcd-bg: #0c1018;
    --text: #e8e8ea;
    --w: min(100vw, calc(100vh * 16 / 9));   /* кадр 16:9 */
    --h: calc(var(--w) * 9 / 16);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; touch-action: none; }
  body {
    font-family: 'Montserrat', 'Segoe UI', sans-serif; color: var(--text);
    display: flex; align-items: center; justify-content: center;
    user-select: none; -webkit-user-select: none;
  }
  #frame {
    position: relative; width: var(--w); height: var(--h); overflow: hidden;
    background: radial-gradient(ellipse at 50% 40%, #2e3034 0%, #1a1b1e 55%, #0f1012 100%);
  }
  #bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  #bg.missing { display: none; }
  #frame::before {                      /* зерно, если фон не загрузился */
    content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .28;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.5 0 0 0 0 0.5 0 0 0 0 0.5 0 0 0 0.5 0'/></filter><rect width='200' height='200' filter='url(%23n)'/></svg>");
  }

  /* ── табло ── */
  #display {
    position: absolute; z-index: 6; left: 50%; top: 1.2%; transform: translateX(-50%);
    width: 40%; height: 11.5%;
    background: linear-gradient(#0a0d13, var(--lcd-bg));
    border: 2px solid #3a3d44; border-radius: 10px;
    box-shadow: inset 0 0 30px #000, 0 2px 0 #46494f, 0 -1px 0 #000, 0 10px 30px rgba(0,0,0,.6);
    display: flex; align-items: center; justify-content: center; text-align: center;
    padding: 1.5% 3%; overflow: hidden;
  }
  #display::after {                     /* блик стекла */
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(170deg, rgba(255,255,255,.07) 0%, transparent 45%);
  }
  #lcd { display: flex; flex-direction: column; gap: .35em; width: 100%; }
  #lcd .tag { font-family: 'Share Tech Mono', monospace; font-size: calc(var(--h) * .02); letter-spacing: .3em; color: #6f86b8; }
  #lcd .q { font-weight: 700; font-size: calc(var(--h) * .034); line-height: 1.2; color: var(--lcd); text-shadow: 0 0 12px rgba(120,160,255,.5); }
  #eq { position: absolute; inset: 0; width: 100%; height: 100%; display: none; }
  #display.eq #lcd { display: none; }
  #display.eq #eq { display: block; }

  /* ── колесо ── */
  #deck {                              /* размер и место задаёт LAYOUT.jog */
    position: absolute; z-index: 1; left: 50%; top: 46%; transform: translate(-50%, -50%);
    width: calc(var(--h) * .70); height: calc(var(--h) * .70);
  }
  #wheel { width: 100%; height: 100%; display: block; overflow: visible; }
  #platter { cursor: grab; transform-origin: 500px 500px; }
  #platter.grab { cursor: grabbing; }
  #platter.spin { animation: spin 3.6s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .seg { cursor: pointer; }
  .seg path { fill: var(--red-dim); stroke: #16171a; stroke-width: 3; transition: fill .18s; }
  .seg text { font-family: 'Montserrat', sans-serif; font-weight: 700; fill: #ff9a9e; letter-spacing: .06em; pointer-events: none; transition: fill .18s; }
  .seg .n { font-family: 'Share Tech Mono', monospace; font-weight: 400; fill: #ff7a7f; opacity: .85; }
  .seg.on path { fill: var(--green); filter: drop-shadow(0 0 8px rgba(47,216,90,.7)); }
  .seg.on text, .seg.on .n { fill: #0b2a12; opacity: 1; }
  .seg.pick path { animation: pick .5s ease-out; }
  @keyframes pick { 0% { fill: #fff; } 100% { fill: var(--green); } }
  .seg.off { opacity: 0; pointer-events: none; }
  #ring { transition: opacity .5s; }
  #ring.hidden { opacity: 0; pointer-events: none; }

  /* центральная кнопка / ступица */
  #centerBtn {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: 24%; aspect-ratio: 1; border-radius: 50%; border: 0; z-index: 3;
    background: radial-gradient(circle at 50% 35%, #3a3d44, #121316 70%);
    box-shadow: 0 0 0 3px #0a0a0b, 0 0 0 5px #3d4047, 0 6px 18px rgba(0,0,0,.8), inset 0 2px 4px rgba(255,255,255,.12);
    color: #ddd; font: 700 calc(var(--h) * .036) 'Montserrat', sans-serif; letter-spacing: .12em;
    cursor: pointer; transition: transform .12s, box-shadow .2s, color .2s;
  }
  #centerBtn:active { transform: translate(-50%, -50%) scale(.95); }
  #centerBtn.pulse { animation: pulse 1.6s ease-in-out infinite; color: var(--green); }
  @keyframes pulse {
    0%,100% { box-shadow: 0 0 0 3px #0a0a0b, 0 0 0 5px #3d4047, 0 0 12px rgba(47,216,90,.2); }
    50%      { box-shadow: 0 0 0 3px #0a0a0b, 0 0 0 5px #2fd85a, 0 0 32px rgba(47,216,90,.6); }
  }
  #centerBtn.hub { pointer-events: none; color: #6f86b8; font-family: 'Share Tech Mono', monospace; font-weight: 400; letter-spacing: .2em; }
  #centerBtn.hidden { display: none; }

  /* ── пады дека с семплами (место — LAYOUT.pads, сама кнопка — на фоне) ── */
  .pad {
    position: absolute; z-index: 6; transform: translate(-50%, -50%); cursor: pointer;
    background: #05080f; border: 2px solid #3d7dff; border-radius: 4px; box-shadow: 0 0 6px rgba(61,125,255,.6);
    opacity: 0; pointer-events: none; padding: 0;
    font: 700 calc(var(--h) * .018) 'Montserrat', sans-serif; letter-spacing: .04em; color: #9db9ff; overflow: hidden;
    transition: opacity .3s, background .1s, box-shadow .1s, left .9s ease-in-out, top .9s ease-in-out, width .9s ease-in-out, height .9s ease-in-out, font-size .9s ease-in-out;
  }
  .pad.show { opacity: 1; pointer-events: auto; }
  .pad.still { transition: none; }
  .pad.show.hit { background: var(--c, #2fd85a); color: #06120a; box-shadow: 0 0 28px var(--c, #2fd85a); }

  /* ── светодиоды каналов: свои поверх фото, на финале — эквалайзер (LAYOUT.leds) ── */
  .led { position: absolute; z-index: 3; transform: translate(-50%, -50%); border-radius: 2px; background: #1c1d20; pointer-events: none; transition: background .06s, box-shadow .06s; }
  .led.on { background: var(--c); box-shadow: 0 0 6px var(--c); }

  /* ── кнопка под диском ── */
  #back {
    position: absolute; z-index: 6; left: 50%; bottom: 3.5%; transform: translateX(-50%);
    padding: .55em 2.4em; border-radius: 999px; border: 2px solid #3d4047;
    background: linear-gradient(#2b2d31, #151618); color: #eee; font: 700 calc(var(--h) * .03) 'Montserrat', sans-serif;
    letter-spacing: .15em; cursor: pointer; box-shadow: 0 6px 18px rgba(0,0,0,.7);
    opacity: 0; pointer-events: none; transition: opacity .8s;
  }
  #back.show { opacity: 1; pointer-events: auto; }

  /* ── результат ── */
  #result {
    position: absolute; inset: 0; z-index: 4; display: none; flex-direction: column;
    align-items: center; justify-content: flex-start; padding: 15% 30% 0;
    background: rgba(8,9,11,.74); backdrop-filter: blur(2px); text-align: center; pointer-events: none;
    opacity: 0; transition: opacity .8s;
  }
  #result.show { display: flex; opacity: 1; }
  #result .tag { font-family: 'Share Tech Mono', monospace; letter-spacing: .3em; color: #6f86b8; font-size: calc(var(--h) * .026); margin-bottom: .8em; }
  #result h1 { margin: 0 0 .5em; font-size: calc(var(--h) * .064); line-height: 1.05; letter-spacing: .04em; color: #fff; text-shadow: 0 0 24px rgba(47,216,90,.6); }
  #result p { margin: 0; font-style: italic; font-weight: 400; font-size: calc(var(--h) * .028); line-height: 1.45; color: #dfe3ea; min-height: 4.4em; }
  #hint { position: absolute; z-index: 3; top: 68%; left: 20%; width: 60%; text-align: center; line-height: 1.5; pointer-events: none; font-size: calc(var(--h) * .022); letter-spacing: .2em; color: #6a6d75; text-transform: uppercase; }
</style>
</head>
<body>
<div id="frame">
  <img id="bg" src="img/bg.png" alt="" onerror="this.classList.add('missing'); document.getElementById('fakeRim').style.display=''">
  <div id="display">
    <div id="lcd"><div class="tag" id="tag">DJ WHEEL</div><div class="q" id="question">КАКОЙ ТЫ ДИДЖЕЙ?</div></div>
    <canvas id="eq"></canvas>
  </div>

  <div id="deck">
    <svg id="wheel" viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
      <defs>
        <radialGradient id="gRim" cx="50%" cy="45%" r="55%">
          <stop offset="80%" stop-color="#3a3d43"/><stop offset="92%" stop-color="#6a6e76"/><stop offset="100%" stop-color="#1b1c1f"/>
        </radialGradient>
        <radialGradient id="gPlatter" cx="50%" cy="40%" r="60%">
          <stop offset="0%" stop-color="#2a2b2f"/><stop offset="70%" stop-color="#151618"/><stop offset="100%" stop-color="#0a0a0b"/>
        </radialGradient>
        <radialGradient id="gHub" cx="50%" cy="35%" r="60%">
          <stop offset="0%" stop-color="#4a4d54"/><stop offset="100%" stop-color="#17181b"/>
        </radialGradient>
        <linearGradient id="gShine" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#fff" stop-opacity=".18"/><stop offset="50%" stop-color="#fff" stop-opacity="0"/>
        </linearGradient>
        <clipPath id="cpRim"><circle cx="500" cy="500" r="470"/></clipPath>
        <clipPath id="cpPlatter"><circle cx="500" cy="500" r="332"/></clipPath>
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".8"/></filter>
      </defs>

      <!-- корпус есть на фоне-фото; рисованный — только если фона нет -->
      <g id="fakeRim" filter="url(#shadow)">
        <circle cx="500" cy="500" r="470" fill="url(#gRim)"/>
        <circle cx="500" cy="500" r="470" fill="url(#gShine)"/>
        <circle cx="500" cy="500" r="352" fill="#0c0d0f"/>
      </g>

      <!-- вращающийся диск -->
      <g id="platter">
        <circle cx="500" cy="500" r="340" fill="url(#gPlatter)"/>
        <g id="grooves" stroke="#fff" stroke-opacity=".045" fill="none"/>
        <image class="photo" xlink:href="img/wheel.png" x="30" y="30" width="940" height="940" clip-path="url(#cpPlatter)"/>
        <!-- маркер -->
        <g id="marker">
          <line x1="500" y1="168" x2="500" y2="235" stroke="#2fd85a" stroke-width="7" stroke-linecap="round"/>
          <line x1="500" y1="168" x2="500" y2="235" stroke="#2fd85a" stroke-width="18" stroke-linecap="round" opacity=".35"/>
        </g>
      </g>

      <!-- кольцо ответов — поверх диска -->
      <g id="ring"></g>
    </svg>
    <button id="centerBtn" class="pulse">START</button>
    <div id="hint">жми старт</div>
  </div>

  <button id="back">НАЗАД</button>

  <div id="result">
    <div class="tag">ТВОЙ ПРОФИЛЬ</div>
    <h1 id="rTitle"></h1>
    <p id="rText"></p>
  </div>
</div>

<script src="layout.js"></script>
<script>
/* ───────── ДАННЫЕ (заглушки — заменить, когда придёт таблица) ───────── */
const DATA = {
  title: 'КАКОЙ ТЫ ДИДЖЕЙ?',
  // у каждого варианта — баллы к четырём профилям [A, B, C, D]
  questions: Array.from({ length: 5 }, (_, q) => ({
    text: `ВОПРОС ${q + 1}: ТЕКСТ ВОПРОСА В ДВЕ СТРОКИ?`,
    options: Array.from({ length: 6 }, (_, i) => ({
      text: `ВАРИАНТ ${i + 1}`,
      score: [0, 1, 2, 3].map(p => (i % 4 === p ? 2 : (i + 1) % 4 === p ? 1 : 0)),
    })),
  })),
  profiles: [
    { name: 'THE SELECTOR',  text: 'Описание-заглушка профиля A. Здесь будет два-три предложения о том, какой ты диджей и чем берёшь танцпол.', track: null },
    { name: 'THE TECHNICIAN', text: 'Описание-заглушка профиля B. Точность, свод по битам и чистые переходы — твоя стихия.', track: null },
    { name: 'THE CROWD READER', text: 'Описание-заглушка профиля C. Ты чувствуешь зал раньше, чем он сам понимает, чего хочет.', track: null },
    { name: 'THE EXPERIMENTER', text: 'Описание-заглушка профиля D. Жанры для тебя не правила, а сырьё.', track: null },
  ],
  bgTrack: null,            // тихий фон на вопросах (URL); null — синтетический пад
  samples: { kick: null, hat: null, clap: null, stab: null },   // URL семплов; null — синтез
  dwellMs: 2000,            // задержался на секции — выбор
  settleMs: 600,            // пауза после выбора перед следующим вопросом
  flickVel: 14,             // градусов за кадр при отпускании — резкий рывок, включается рулетка
};

/* ───────── ГЕОМЕТРИЯ ───────── */
const CX = 500, CY = 500, R_IN = 372, R_OUT = 448, R_TXT = 412;
const SEG = 6, SPAN = 180, STEP = SPAN / SEG, GAP = 1.6;
const LIMIT = SPAN / 2;                          // маркер ходит от -90 до +90
const NS = 'http://www.w3.org/2000/svg', XL = 'http://www.w3.org/1999/xlink';
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const ring = $('#ring'), platter = $('#platter'), btn = $('#centerBtn'), display = $('#display');
const tag = $('#tag'), question = $('#question'), result = $('#result'), hint = $('#hint'), back = $('#back');

const pol = (r, a) => { const t = (a - 90) * Math.PI / 180; return [CX + r * Math.cos(t), CY + r * Math.sin(t)]; };
function arcPath(r0, r1, a0, a1) {
  const [x0, y0] = pol(r1, a0), [x1, y1] = pol(r1, a1), [x2, y2] = pol(r0, a1), [x3, y3] = pol(r0, a0);
  return `M${x0} ${y0} A${r1} ${r1} 0 0 1 ${x1} ${y1} L${x2} ${y2} A${r0} ${r0} 0 0 0 ${x3} ${y3} Z`;
}
function textArc(r, a0, a1) { const [x0, y0] = pol(r, a0), [x1, y1] = pol(r, a1); return `M${x0} ${y0} A${r} ${r} 0 0 1 ${x1} ${y1}`; }
const el = (n, attrs = {}) => { const e = document.createElementNS(NS, n); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; };
const tpath = id => { const t = el('textPath', { startOffset: '50%' }); t.setAttributeNS(XL, 'xlink:href', '#' + id); t.setAttribute('href', '#' + id); return t; };

// фото колеса: если файла нет — прячем, остаётся рисованный диск
$$('.photo').forEach(im => im.addEventListener('error', () => im.remove()));
$('#fakeRim').style.display = 'none';

/* ───────── РАСКЛАДКА ПО ФОТО ПУЛЬТА (layout.js из tools/build_bg.py) ───────── */
const L = typeof LAYOUT !== 'undefined' ? LAYOUT : null;
const PADS = [['kick', 'KICK', '#2fd85a'], ['hat', 'HAT', '#e8e14a'], ['clap', 'CLAP', '#ff7a3b'], ['snare', 'SNARE', '#4a9bff']];
const leds = [];                // столбики светодиодов: {els сверху вниз, v}
const IMG = {};                 // при сборке в один файл pack_single_file.py кладёт сюда data-URI картинок
function addPad(i, x, y, w, h) {
  const b = document.createElement('button'); b.className = 'pad'; b.dataset.s = PADS[i][0]; b.style.setProperty('--c', PADS[i][2]);
  b.style.left = x + '%'; b.style.top = y + '%'; b.style.width = w + '%'; b.style.height = h + '%';
  b.dataset.home = JSON.stringify([x, y, w, h]);
  b.textContent = PADS[i][1]; $('#frame').appendChild(b);
}
// финал: пады по очереди вспыхивают на месте, потом разъезжаются крупно под описание
const PAD_TARGET = { y: 73, w: 7.6, h: 13.5, xs: [36.5, 45.5, 54.5, 63.5], font: .026 };   // центр группы — 50 %
function padsHome() {
  $$('.pad').forEach(b => {
    const [x, y, w, h] = JSON.parse(b.dataset.home);
    b.classList.add('still'); b.style.left = x + '%'; b.style.top = y + '%'; b.style.width = w + '%'; b.style.height = h + '%'; b.style.fontSize = '';
    b.offsetWidth; b.classList.remove('still');
  });
}
function padsShowcase() {
  const pads = $$('.pad');
  pads.forEach(b => {                                   // все разом вспыхнули (без звука) и поехали
    b.classList.add('show', 'hit'); setTimeout(() => b.classList.remove('hit'), 350);
  });
  setTimeout(() => pads.forEach((b, i) => {
    b.style.left = PAD_TARGET.xs[i] + '%'; b.style.top = PAD_TARGET.y + '%'; b.style.width = PAD_TARGET.w + '%'; b.style.height = PAD_TARGET.h + '%';
    b.style.fontSize = `calc(var(--h) * ${PAD_TARGET.font})`;
  }), 150);
}
// v = null — как на фото (горят все, кроме нижнего); число или массив 0..1 — уровень столбика
function setLeds(v) {
  leds.forEach((c, i) => {
    const lvl = v === null ? 1 : Array.isArray(v) ? v[i] : v, n = c.els.length;
    c.els.forEach((e, k) => e.classList.toggle('on', v === null ? k < n - 1 : (n - k) / n <= lvl + 1e-6));
  });
}
if (L) {
  const deck = $('#deck'), size = 2 * L.jog.r * 500 / 470;            // r джога на фото = r470 нашей рамки
  deck.style.left = L.jog.x * 100 + '%'; deck.style.top = L.jog.y * 100 + '%';
  deck.style.width = deck.style.height = `calc(var(--h) * ${size.toFixed(4)})`;
  if (L.jog.platter) $('#cpPlatter circle').setAttribute('r', Math.round(470 * L.jog.platter));
  L.pads.forEach((p, i) => addPad(i, p.x * 100, p.y * 100, p.w * 100, p.h * 100));
  L.leds.forEach(col => {
    const els = col.map(([x, y], k) => {
      const e = document.createElement('div'); e.className = 'led'; e.style.setProperty('--c', L.led.colors[k]);
      e.style.left = x * 100 + '%'; e.style.top = y * 100 + '%'; e.style.width = L.led.w * 100 + '%'; e.style.height = L.led.h * 100 + '%';
      $('#frame').appendChild(e); return e;
    });
    leds.push({ els, v: 0 });
  });
  setLeds(null);
} else {
  PADS.forEach((_, i) => addPad(i, i < 2 ? 12 : 88, i % 2 ? 68 : 46, 9, 16));
}

// бороздки на диске
const grooves = $('#grooves');
for (let r = 135; r < 336; r += 4) grooves.appendChild(el('circle', { cx: CX, cy: CY, r }));

// секции кольца
const segs = [];
for (let i = 0; i < SEG; i++) {
  const a0 = -LIMIT + i * STEP + GAP / 2, a1 = a0 + STEP - GAP;
  const g = el('g', { class: 'seg' });
  g.appendChild(el('path', { d: arcPath(R_IN, R_OUT, a0, a1) }));
  g.appendChild(el('path', { id: 'tp' + i, d: textArc(R_TXT, a0, a1), style: 'fill:none;stroke:none' }));   // направляющая текста, не рисуется
  const t = el('text', { 'font-size': 30, 'text-anchor': 'middle', 'dominant-baseline': 'middle' });
  const tp = tpath('tp' + i); t.appendChild(tp); g.appendChild(t);
  g.appendChild(el('path', { id: 'np' + i, d: textArc(R_OUT - 14, a0, a1), style: 'fill:none;stroke:none' }));
  const n = el('text', { class: 'n', 'font-size': 18, 'text-anchor': 'start', 'dominant-baseline': 'middle' });
  const np = tpath('np' + i); np.setAttribute('startOffset', '4%'); np.textContent = i + 1; n.appendChild(np); g.appendChild(n);
  g.addEventListener('click', () => { if (state === 'question' && !locked) { snapTo(i); commit(); } });
  ring.appendChild(g); segs.push({ g, tp });
}
const segCenter = i => -LIMIT + (i + .5) * STEP;

function fillRing(options) {
  segs.forEach((s, i) => {
    const o = options[i];
    s.g.classList.toggle('off', !o);
    if (!o) return;
    s.tp.textContent = o.text;
    const len = o.text.length;
    s.tp.parentNode.setAttribute('font-size', len <= 8 ? 30 : len <= 12 ? 24 : len <= 16 ? 19 : 15);
  });
}

/* ───────── ВРАЩЕНИЕ ───────── */
let rot = 0, state = 'start', selected = -1, drag = null, vel = 0, raf = 0, locked = false, dwell = 0;
const setRot = a => { rot = a; platter.style.transform = `rotate(${a}deg)`; };
function highlight() {
  const i = rot >= -LIMIT && rot < LIMIT ? Math.floor((rot + LIMIT) / STEP) : -1;
  if (i === selected) return;
  selected = i;
  segs.forEach((s, k) => s.g.classList.toggle('on', k === i));
  if (i >= 0 && navigator.vibrate) navigator.vibrate(8);
  // задержался на секции — считаем выбором
  clearTimeout(dwell);
  if (i >= 0 && drag) dwell = setTimeout(() => { if (drag && selected === i) { drag = null; platter.classList.remove('grab'); snapTo(i); commit(); } }, DATA.dwellMs);
}
const angleOf = e => { const b = $('#wheel').getBoundingClientRect(); return Math.atan2(e.clientY - (b.top + b.height / 2), e.clientX - (b.left + b.width / 2)) * 180 / Math.PI; };
const clamp = a => { const over = LIMIT + 6; return Math.max(-over, Math.min(over, a)); };

platter.addEventListener('pointerdown', e => {
  if (state !== 'question' || locked) return;
  cancelAnimationFrame(raf); platter.style.transition = 'none'; platter.classList.add('grab');
  drag = { a: angleOf(e), r: rot, t: performance.now(), v: 0 }; platter.setPointerCapture(e.pointerId);
  highlight();
});
platter.addEventListener('pointermove', e => {
  if (!drag) return;
  const a = angleOf(e); let d = a - drag.a; if (d > 180) d -= 360; if (d < -180) d += 360;
  const now = performance.now(), prev = rot;
  setRot(clamp(drag.r + d)); highlight();
  drag.v = (rot - prev) / Math.max(1, now - drag.t) * 16; drag.t = now;
});
const endDrag = () => {
  if (!drag) return; platter.classList.remove('grab'); clearTimeout(dwell);
  vel = Math.abs(drag.v) > 1.5 ? drag.v : 0; drag = null;
  if (Math.abs(vel) >= DATA.flickVel) return roulette();   // резкий рывок — случайный выбор
  vel ? inertia() : settle();
};
// рулетка: маркер мечется по дуге, замедляясь, и встаёт на случайную секцию
function roulette() {
  cancelAnimationFrame(raf); locked = true;
  const target = Math.floor(Math.random() * SEG), end = segCenter(target);
  const t0 = performance.now(), dur = 1800;
  tag.textContent = 'RANDOM!';
  const zig = s => { const k = Math.floor(s / SPAN), f = s - k * SPAN; return k % 2 ? LIMIT - f : -LIMIT + f; };   // путь по зигзагу → угол
  const off = Math.max(0, Math.min(SPAN, rot + LIMIT));                                          // старт с текущего угла
  const k = 3 + Math.floor(off / SPAN), sEnd = k * SPAN + (k % 2 ? LIMIT - end : end + LIMIT);   // три прохода дуги и на цель
  const path = sEnd - off;
  const step = () => {
    const u = Math.min(1, (performance.now() - t0) / dur), e = 1 - Math.pow(1 - u, 3);
    setRot(zig(off + e * path)); highlight();
    if (u < 1) raf = requestAnimationFrame(step);
    else { locked = false; snapTo(target); commit(); }
  };
  step();
}
platter.addEventListener('pointerup', endDrag); platter.addEventListener('pointercancel', endDrag);

const nearest = () => Math.max(0, Math.min(SEG - 1, Math.round((rot + LIMIT) / STEP - .5)));
function inertia() {
  vel *= .9; setRot(clamp(rot + vel)); highlight();
  if (Math.abs(vel) > .3 && Math.abs(rot) < LIMIT + 5) raf = requestAnimationFrame(inertia); else settle();
}
function settle() { snapTo(nearest()); commit(); }        // отпустил — выбрал
function snapTo(i) {
  cancelAnimationFrame(raf);
  platter.style.transition = 'transform .35s cubic-bezier(.2,.8,.3,1.2)';
  setRot(segCenter(i)); highlight();
}

/* ───────── СЦЕНАРИЙ ───────── */
let qi = 0, scores = [0, 0, 0, 0];
function showStart() {
  state = 'start'; qi = 0; scores = [0, 0, 0, 0]; locked = false;
  stopAll(); platter.classList.remove('spin'); platter.style.transition = 'none'; setRot(0); selected = -1;
  segs.forEach(s => s.g.classList.remove('on', 'pick'));
  display.classList.remove('eq'); result.classList.remove('show'); ring.classList.add('hidden');
  $$('.pad').forEach(p => p.classList.remove('show')); padsHome(); back.classList.remove('show');
  setLeds(null);
  tag.textContent = 'DJ WHEEL'; question.textContent = DATA.title;
  btn.textContent = 'START'; btn.className = 'pulse';
  hint.textContent = 'жми старт';
}
function showQuestion() {
  state = 'question'; locked = false; const q = DATA.questions[qi];
  ring.classList.remove('hidden'); fillRing(q.options);
  tag.textContent = `ВОПРОС ${qi + 1} / ${DATA.questions.length}`; question.textContent = q.text;
  btn.textContent = `${qi + 1}/${DATA.questions.length}`; btn.className = 'hub';
  platter.style.transition = 'transform .5s ease'; setRot(0); selected = -1; segs.forEach(s => s.g.classList.remove('on', 'pick'));
  hint.textContent = 'крути колесо: отпустил — выбрал';
}
function commit() {
  if (selected < 0 || locked) return;
  locked = true; const i = selected;
  segs[i].g.classList.add('pick'); blip();
  DATA.questions[qi].options[i].score.forEach((v, p) => scores[p] += v);
  setTimeout(() => { qi++; qi < DATA.questions.length ? showQuestion() : showResult(); }, DATA.settleMs);
}
function showResult() {
  state = 'result';
  ring.classList.add('hidden'); btn.className = 'hidden'; hint.textContent = ''; setLeds(0);
  tag.textContent = 'АНАЛИЗ'; question.textContent = 'СОБИРАЕМ ТВОЙ СЕТ…';
  fadeBg();
  const max = Math.max(...scores); const best = scores.map((v, i) => v === max ? i : -1).filter(i => i >= 0);
  const p = DATA.profiles[best[Math.floor(Math.random() * best.length)]];
  setTimeout(() => {
    platter.style.transition = 'none'; platter.classList.add('spin');
    padsShowcase();
    setTimeout(() => {
      display.classList.add('eq'); startMusic(p.track);
      $('#rTitle').textContent = p.name; $('#rText').textContent = '';
      result.classList.add('show');
      typeText($('#rText'), p.text);
      setTimeout(() => back.classList.add('show'), 700);    // после переезда падов
    }, 500);
  }, 2200);
}
function typeText(node, text) { let i = 0; const t = setInterval(() => { node.textContent = text.slice(0, ++i); if (i >= text.length) clearInterval(t); }, 28); }

// полный экран можно просить только по жесту — делаем это на START (iPhone Safari не умеет, там — «На экран Домой»)
function goFullscreen() {
  const el = document.documentElement, rq = el.requestFullscreen || el.webkitRequestFullscreen;
  if (rq && !document.fullscreenElement && !document.webkitFullscreenElement) { try { const p = rq.call(el, { navigationUI: 'hide' }); if (p && p.catch) p.catch(() => {}); } catch (e) {} }
  if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(() => {});
}
btn.addEventListener('click', () => { if (state === 'start') { goFullscreen(); ensureAudio(); startBg(); showQuestion(); } });
back.addEventListener('click', showStart);
$$('.pad').forEach(p => {
  p.addEventListener('pointerdown', () => { playSample(p.dataset.s); p.classList.add('hit'); setTimeout(() => p.classList.remove('hit'), 120); });
});

/* ───────── ЗВУК + ЭКВАЛАЙЗЕР ───────── */
let ac, analyser, master, bgGain, trackGain, synth = null, bgSynth = null, media = null, bgMedia = null, eqRaf = 0;
function ensureAudio() {
  if (ac) { ac.resume(); return; }
  ac = new (window.AudioContext || window.webkitAudioContext)();
  analyser = ac.createAnalyser(); analyser.fftSize = 256; analyser.smoothingTimeConstant = .8;
  master = ac.createGain(); master.connect(analyser); analyser.connect(ac.destination);
  bgGain = ac.createGain(); bgGain.connect(ac.destination);       // фон мимо анализатора: эквалайзер только для трека
  trackGain = ac.createGain(); trackGain.connect(master);
}
function ramp(g, v, t) { g.gain.cancelScheduledValues(ac.currentTime); g.gain.setValueAtTime(g.gain.value, ac.currentTime); g.gain.linearRampToValueAtTime(v, ac.currentTime + t); }
function startBg() {
  bgGain.gain.setValueAtTime(0, ac.currentTime); ramp(bgGain, .22, 2);
  if (DATA.bgTrack) { bgMedia = new Audio(DATA.bgTrack); bgMedia.loop = true; ac.createMediaElementSource(bgMedia).connect(bgGain); bgMedia.play(); }
  else bgSynth = makePad(bgGain);
}
function fadeBg() { if (!ac) return; ramp(bgGain, 0, 2); setTimeout(stopBg, 2100); }
function stopBg() { if (bgMedia) { bgMedia.pause(); bgMedia = null; } if (bgSynth) { bgSynth.stop(); bgSynth = null; } }
function startMusic(url) {
  trackGain.gain.setValueAtTime(0, ac.currentTime); ramp(trackGain, .8, 1.5);
  if (url) { media = new Audio(url); media.loop = true; media.crossOrigin = 'anonymous'; ac.createMediaElementSource(media).connect(trackGain); media.play(); }
  else synth = makeBeat(trackGain);
  drawEq();
}
function stopAll() {
  cancelAnimationFrame(eqRaf); stopBg();
  if (media) { media.pause(); media = null; }
  if (synth) { synth.stop(); synth = null; }
}

// одноразовые семплы (синтез, пока нет файлов)
const sampleBuf = {};
function playSample(name, vol = 1) {
  ensureAudio();
  const out = ac.createGain(); out.gain.value = vol; out.connect(master);
  const url = DATA.samples[name];
  if (url) {
    if (sampleBuf[name]) { const s = ac.createBufferSource(); s.buffer = sampleBuf[name]; s.connect(out); s.start(); }
    else fetch(url).then(r => r.arrayBuffer()).then(b => ac.decodeAudioData(b)).then(b => { sampleBuf[name] = b; playSample(name); });
    return;
  }
  const t = ac.currentTime;
  if (name === 'kick') {
    const o = ac.createOscillator(), g = ac.createGain();
    o.frequency.setValueAtTime(160, t); o.frequency.exponentialRampToValueAtTime(42, t + .14);
    g.gain.setValueAtTime(1.2, t); g.gain.exponentialRampToValueAtTime(.001, t + .35);
    o.connect(g).connect(out); o.start(t); o.stop(t + .4);
  } else if (name === 'hat' || name === 'clap') {
    const len = name === 'hat' ? .12 : .25, b = ac.createBuffer(1, ac.sampleRate * len, ac.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < d.length; i++) { const x = i / d.length; d[i] = (Math.random() * 2 - 1) * (name === 'hat' ? Math.pow(1 - x, 5) : Math.pow(1 - x, 2) * (x < .03 || (x > .04 && x < .07) || x > .09 ? 1 : .3)); }
    const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    s.buffer = b; f.type = name === 'hat' ? 'highpass' : 'bandpass'; f.frequency.value = name === 'hat' ? 7000 : 1800; f.Q.value = name === 'hat' ? 1 : .8;
    g.gain.value = name === 'hat' ? .5 : .9; s.connect(f).connect(g).connect(out); s.start(t);
  } else {                                  // snare: тон ~190 Гц + шумовой хвост
    const o = ac.createOscillator(), g = ac.createGain();
    o.frequency.setValueAtTime(190, t); o.frequency.exponentialRampToValueAtTime(120, t + .1);
    g.gain.setValueAtTime(.7, t); g.gain.exponentialRampToValueAtTime(.001, t + .18);
    o.connect(g).connect(out); o.start(t); o.stop(t + .2);
    const b = ac.createBuffer(1, ac.sampleRate * .22, ac.sampleRate), dd = b.getChannelData(0);
    for (let i = 0; i < dd.length; i++) dd[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / dd.length, 2.5);
    const s = ac.createBufferSource(), f = ac.createBiquadFilter(), ng = ac.createGain();
    s.buffer = b; f.type = 'highpass'; f.frequency.value = 1500; ng.gain.value = .8; s.connect(f).connect(ng).connect(out); s.start(t);
  }
}
function blip() {                       // щелчок подтверждения выбора
  if (!ac) return; const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
  o.frequency.value = 1400; g.gain.setValueAtTime(.15, t); g.gain.exponentialRampToValueAtTime(.001, t + .08);
  o.connect(g).connect(ac.destination); o.start(t); o.stop(t + .1);
}
// фон на вопросах: тихий пад из двух расстроенных пил через фильтр, аккорды по кругу
function makePad(out) {
  const chords = [[0, 3, 7, 10], [5, 8, 12, 15], [3, 7, 10, 14], [-2, 2, 5, 9]];
  const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 500; f.Q.value = .7;
  const lfo = ac.createOscillator(), lg = ac.createGain(); lfo.frequency.value = .08; lg.gain.value = 250; lfo.connect(lg).connect(f.frequency); lfo.start();
  f.connect(out);
  let ci = 0, timer; const oscs = [];
  const play = () => {
    const t = ac.currentTime;
    oscs.forEach(o => { o.g.gain.linearRampToValueAtTime(0, t + 1.5); o.o.stop(t + 1.6); }); oscs.length = 0;
    chords[ci++ % chords.length].forEach(n => [-6, 6].forEach(det => {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = 'sawtooth'; o.frequency.value = 110 * Math.pow(2, n / 12); o.detune.value = det;
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.06, t + 1.5);
      o.connect(g).connect(f); o.start(t); oscs.push({ o, g });
    }));
    timer = setTimeout(play, 6000);
  };
  play();
  return { stop: () => { clearTimeout(timer); oscs.forEach(o => o.o.stop()); lfo.stop(); } };
}
// заглушка трека: простой техно-луп из осцилляторов, чтобы эквалайзеру было что показывать
function makeBeat(out) {
  const bpm = 126, beat = 60 / bpm, notes = [41.2, 41.2, 49, 55, 41.2, 41.2, 36.7, 49];
  let n = 0, t = ac.currentTime + .05, timer;
  const tick = () => {
    while (t < ac.currentTime + .3) {
      const step = n % 16;
      const k = ac.createOscillator(), kg = ac.createGain();
      k.frequency.setValueAtTime(150, t); k.frequency.exponentialRampToValueAtTime(40, t + .12);
      kg.gain.setValueAtTime(step % 4 === 0 ? 1 : 0, t); kg.gain.exponentialRampToValueAtTime(.001, t + .25);
      k.connect(kg).connect(out); k.start(t); k.stop(t + .3);
      const h = ac.createBufferSource(), hb = ac.createBuffer(1, 2205, ac.sampleRate), d = hb.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 6);
      h.buffer = hb; const hf = ac.createBiquadFilter(); hf.type = 'highpass'; hf.frequency.value = 7000;
      const hg = ac.createGain(); hg.gain.value = step % 2 ? .35 : .12; h.connect(hf).connect(hg).connect(out); h.start(t);
      const b = ac.createOscillator(), bg = ac.createGain(), bf = ac.createBiquadFilter();
      b.type = 'sawtooth'; b.frequency.value = notes[step % 8] * 2; bf.type = 'lowpass'; bf.frequency.setValueAtTime(900, t); bf.frequency.exponentialRampToValueAtTime(200, t + .2);
      bg.gain.setValueAtTime(step % 4 === 0 ? 0 : .35, t); bg.gain.exponentialRampToValueAtTime(.001, t + .22);
      b.connect(bf).connect(bg).connect(out); b.start(t); b.stop(t + .25);
      t += beat / 4; n++;
    }
    timer = setTimeout(tick, 100);
  };
  tick();
  return { stop: () => clearTimeout(timer) };
}
function drawEq() {
  const c = $('#eq'), ctx = c.getContext('2d');
  const buf = new Uint8Array(analyser.frequencyBinCount);
  const loop = () => {
    const w = c.width = c.clientWidth * devicePixelRatio, h = c.height = c.clientHeight * devicePixelRatio;
    analyser.getByteFrequencyData(buf);
    ctx.clearRect(0, 0, w, h);
    const bars = 40, bw = w / bars, pad = bw * .25;
    if (leds.length) {                     // светодиоды каналов: 8 полос от баса к верху, падают с инерцией
      setLeds(leds.map((c, i) => {
        const a = Math.floor(Math.pow(i / leds.length, 1.6) * 48), b = Math.floor(Math.pow((i + 1) / leds.length, 1.6) * 48) + 1;
        let m = 0; for (let k = a; k < b; k++) m = Math.max(m, buf[k]);
        return c.v = Math.max(c.v - .05, Math.min(1, m / 255 * 1.15));
      }));
    }
    for (let i = 0; i < bars; i++) {
      const v = buf[Math.floor(Math.pow(i / bars, 1.4) * 56)] / 255;
      const bh = Math.max(3, v * h * .85);
      const g = ctx.createLinearGradient(0, h, 0, h - bh);
      g.addColorStop(0, '#2fd85a'); g.addColorStop(.7, '#e8e14a'); g.addColorStop(1, '#ff3b3b');
      ctx.fillStyle = g; ctx.fillRect(i * bw + pad, h - bh - h * .08, bw - pad * 2, bh);
    }
    eqRaf = requestAnimationFrame(loop);
  };
  loop();
}

showStart();
</script>
